<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <!-- Shield outline -->
  <path d="M50 18 L76 28 C76 56 50 78 50 78 C50 78 24 56 24 28 Z" fill="none" stroke="#E9D5FF" stroke-width="4" stroke-linejoin="round" />
  <!-- Radiant Beacon Light Beams -->
  <polygon points="50,30 34,70 66,70" fill="url(#beamGrad)" />
  <!-- Central Beacon Star / Light Source -->
  <circle cx="50" cy="36" r="6" fill="#FFFFFF" />
  <circle cx="50" cy="36" r="10" fill="#E9D5FF" fill-opacity="0.4" />
  <!-- Base beacon pedestal -->
  <rect x="42" y="62" width="16" height="4" rx="2" fill="#E9D5FF" />
</svg>
